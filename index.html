<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TasasApp</title>

    <style>
        
body{

font-family:Arial,sans-serif;

background:linear-gradient(
180deg,
#e3f2fd,
#f8fbff
);

padding:20px;

}

.container{

max-width:420px;

margin:auto;

background:white;

padding:25px;

border-radius:22px;

box-shadow:
0 12px 30px rgba(0,0,0,.12);

}

h1{

text-align:center;
margin-bottom:5px;
color:#1565C0;
font-size:32px;

}

.subtitulo{

text-align:center;
color:#777;
margin-top:0;
margin-bottom:25px;
font-size:14px;

}

input{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:15px;
font-size:18px;
box-sizing:border-box;
}

button{

width:100%;

padding:15px;

font-size:18px;

font-weight:bold;

border:none;

border-radius:12px;

cursor:pointer;

background:#1565C0;

color:white;

transition:.25s;

}

button:hover{

transform:scale(1.02);

background:#0D47A1;

}

.resultado{
margin-top:20px;
font-size:18px;
}

.linea{
margin-bottom:10px;
}

        .tasas-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

margin-bottom:25px;

}

.tasa-card{

background:#f7fbff;

border-radius:16px;

padding:15px;

text-align:center;

box-shadow:0 4px 10px rgba(0,0,0,.08);

transition:.25s;

}

.tasa-card:hover{

transform:translateY(-3px);

}

.icono{

font-size:30px;

}

.nombre{

margin-top:8px;

font-weight:bold;

color:#555;

}

.valor{

margin-top:8px;

font-size:22px;

font-weight:bold;

color:#1565C0;

}
        
</style>

</head>

<body>

<div class="container">

<h1>💱 Cambio Express</h1>

<p class="subtitulo">
Actualización automática de tasas
</p>

<div class="tasas-grid">

    <div class="tasa-card">
        <div class="icono">🇺🇸</div>
        <div class="nombre">USD</div>
        <div class="valor">1.00</div>
    </div>

    <div class="tasa-card">
        <div class="icono">🇻🇪</div>
        <div class="nombre">Bs</div>
        <div class="valor" id="vnz">...</div>
    </div>

    <div class="tasa-card">
        <div class="icono">🇨🇺</div>
        <div class="nombre">CUP</div>
        <div class="valor" id="cuba">...</div>
    </div>

    <div class="tasa-card">
        <div class="icono">💳</div>
        <div class="nombre">Clásica</div>
        <div class="valor" id="clasica">...</div>
    </div>

    <div class="tasa-card">
        <div class="icono">💵</div>
        <div class="nombre">Efectivo</div>
        <div class="valor" id="efectivo">...</div>
    </div>

</div>

<input
type="number"
id="monto"
placeholder="Ingrese monto">

<label><b>Desde:</b></label>

<select id="desde" style="width:100%;padding:10px;margin-top:5px;margin-bottom:10px;font-size:18px;">
</select>

<div style="text-align:center;margin:10px 0;">

<button
type="button"
onclick="intercambiar()"
style="
width:55px;
height:55px;
border-radius:50%;
font-size:24px;
padding:0;
background:#1976D2;
">

🔄

</button>

</div>

<label><b>Hacia:</b></label>

<select id="hacia" style="width:100%;padding:10px;margin-top:5px;margin-bottom:15px;font-size:18px;">
</select>

<button onclick="calcular()">
Convertir
</button>

<div class="resultado" id="resultado"></div>

<button
id="btnCompartir"
onclick="compartir()"
style="display:none;margin-top:15px;background:#25D366;">

📤 Compartir

</button>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwzp-bp3UYlhGJR4XwJ0App_zfmYrEuP_gafnisgDgurGWzfTekK6YulzMJpLpLrIm1KQ/exec";

let tasas = {};

    const monedas = {
    USD: {
        simbolo: "USD",
        icono: "🇺🇸"
    },
    VNZ: {
        simbolo: "Bs",
        icono: "🇻🇪"
    },
    CUBA: {
        simbolo: "CUP",
        icono: "🇨🇺"
    },
    CLASICA: {
        simbolo: "Clásica",
        icono: "💳"
    },
    EFECTIVO: {
        simbolo: "Efectivo",
        icono: "💵"
    }
};

async function cargarTasas(){

    const respuesta = await fetch(API_URL);
    const datos = await respuesta.json();

    datos.forEach(item=>{
        tasas[item.Concepto]=Number(item.Valor);
    });

    document.getElementById("vnz").innerText = tasas.VNZ;
    document.getElementById("cuba").innerText = tasas.CUBA;
    document.getElementById("clasica").innerText = tasas.CLASICA;
    document.getElementById("efectivo").innerText = tasas.EFECTIVO;

    const desde = document.getElementById("desde");
const hacia = document.getElementById("hacia");

desde.innerHTML = "";
hacia.innerHTML = "";

datos.forEach(item => {

    const opcion1 = document.createElement("option");
    opcion1.value = item.Concepto;
    opcion1.text = item.Nombre;

    const opcion2 = opcion1.cloneNode(true);

    desde.appendChild(opcion1);
    hacia.appendChild(opcion2);

});

desde.value = "USD";
hacia.value = "VNZ";

}

function calcular(){

    let monto = parseFloat(document.getElementById("monto").value);

    if(isNaN(monto)){
        alert("Ingrese un monto");
        return;
    }

    const origen = document.getElementById("desde").value;
    const destino = document.getElementById("hacia").value;

    const tasaOrigen = tasas[origen];
    const tasaDestino = tasas[destino];

    const resultado = (monto * tasaDestino) / tasaOrigen;

    const monedaOrigen = monedas[origen];
const monedaDestino = monedas[destino];

const montoFormateado = monto.toLocaleString("es-VE", {minimumFractionDigits:2});
const resultadoFormateado = resultado.toLocaleString("es-VE", {minimumFractionDigits:2});

    window.ultimaConversion = {

    monto: montoFormateado,

    resultado: resultadoFormateado,

    origen: monedaOrigen.simbolo,

    destino: monedaDestino.simbolo,

    origenIcono: monedaOrigen.icono,

    destinoIcono: monedaDestino.icono

};

    document.getElementById("resultado").innerHTML = `
    <div class="linea" style="text-align:center;padding:15px;border-radius:10px;background:#f8f9fa;margin-top:15px;">

        <div style="font-size:22px;">
            ${monedaOrigen.icono} ${montoFormateado} ${monedaOrigen.simbolo}
        </div>

        <div style="font-size:28px;margin:10px 0;">
            ⬇️
        </div>

        <div style="font-size:30px;font-weight:bold;color:#0d6efd;">
            ${monedaDestino.icono} ${resultadoFormateado} ${monedaDestino.simbolo}
        </div>

    </div>
`;
    document.getElementById("btnCompartir").style.display = "block";
}

    function intercambiar(){

    const desde = document.getElementById("desde");
    const hacia = document.getElementById("hacia");

    const temp = desde.value;

    desde.value = hacia.value;

    hacia.value = temp;

}

    function compartir(){

    if(!window.ultimaConversion){
        alert("Primero realiza una conversión.");
        return;
    }

    const texto = `
💱 Cambio Express

${window.ultimaConversion.origenIcono} ${window.ultimaConversion.monto} ${window.ultimaConversion.origen}

⬇️

${window.ultimaConversion.destinoIcono} ${window.ultimaConversion.resultado} ${window.ultimaConversion.destino}

Conversión realizada con Cambio Express
`;

    if(navigator.share){

        navigator.share({
            title:"Cambio Express",
            text:texto
        });

    }else{

        navigator.clipboard.writeText(texto);

        alert("La conversión fue copiada al portapapeles.");

    }

}
    
cargarTasas();

</script>
  
</body>
</html>

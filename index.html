<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TasasApp</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:15px;
font-size:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
font-size:18px;
cursor:pointer;
}

.resultado{
margin-top:20px;
font-size:18px;
}

.linea{
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>TasasApp</h1>

<p><b>VNZ:</b> 785</p>
<p><b>CUBA:</b> 640</p>
<p><b>CLÁSICA:</b> 0.90</p>
<p><b>EFECTIVO:</b> 0.83</p>

<input
type="number"
id="monto"
placeholder="Ingrese monto">

<button onclick="calcular()">
Calcular
</button>

<div class="resultado" id="resultado">

</div>

</div>

<script>

function calcular(){

let monto =
parseFloat(
document.getElementById("monto").value
);

if(isNaN(monto)){
alert("Ingrese un monto");
return;
}

let vnz = 785;
let cuba = 640;
let clasica = 0.90;
let efectivo = 0.83;

document.getElementById("resultado").innerHTML =

`
<div class="linea"><b>USD:</b> ${monto}</div>

<div class="linea"><b>CUP:</b>
${(monto*cuba).toFixed(2)}
</div>

<div class="linea"><b>BVs:</b>
${(monto*vnz).toFixed(2)}
</div>

<div class="linea"><b>Clásica:</b>
${(monto*clasica).toFixed(2)}
</div>

<div class="linea"><b>Efectivo:</b>
${(monto*efectivo).toFixed(2)}
</div>
`;

}

</script>

</body>
</html>
